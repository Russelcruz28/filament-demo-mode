name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['^4.0', '^5.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, mbstring
          coverage: none
      - run: composer validate --strict
      - run: composer update --with 'filament/filament:${{ matrix.filament }}' --prefer-dist --no-interaction
      - run: composer test
      - run: composer lint
